name: Keep Render Backend Awake

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 20 https://expensetracker-4g98.onrender.com/api/health \
            && echo "Backend is awake" \
            || echo "Ping failed (server may be waking up)"
